# Unified Zero Trust Framework — CI
# Validates YAML syntax and Markdown formatting.
# Spec repo: no code builds, only spec content.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate YAML files
        run: |
          echo "Validating YAML files..."
          FAILED=0
          for f in $(find . -name '*.yaml' -o -name '*.yml' | sort); do
            if python3 -c "
import yaml, sys
try:
    with open('$f') as fh:
        yaml.safe_load(fh)
    print(f'  OK: $f')
except Exception as e:
    print(f'  FAIL: $f — {e}')
    sys.exit(1)
"; then
              :
            else
              FAILED=1
            fi
          done
          if [ "$FAILED" = "1" ]; then
            echo "❌ YAML validation failed"
            exit 1
          fi
          echo "✅ All YAML files valid"

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@b4c9feab76d8025d1e83c653fa2dea9c6bb99c06 # v19
        with:
          globs: "**/*.md"
          separator: ","
