# Unified Zero Trust Framework — Finding-to-Pillar Mappings
# Reference: SPEC.md §5 — Finding-to-Pillar Mapping
#
# This file defines the default mapping rules from security scanner findings
# to UZTF pillars. Implementations should use these as the baseline mapping
# and allow project-specific overrides.
#
# Format:
#   - keywords: [list of keywords to match in finding title/description]
#     pillar: <pillar_name>
    default_maturity: <Baseline|Advanced|Adaptive>

# ──────────────────────────────────────────────
# Pillar: Identity
# Authentication, authorization, credential management
# ──────────────────────────────────────────────
- keywords: [secret, secrets]
  pillar: identity
  default_maturity: Baseline
- keywords: [credential, credentials]
  pillar: identity
  default_maturity: Baseline
- keywords: [password, passwords]
  pillar: identity
  default_maturity: Baseline
- keywords: [token, tokens, api.key, api_key]
  pillar: identity
  default_maturity: Baseline
- keywords: [ssh.key, ssh_key, private.key]
  pillar: identity
  default_maturity: Baseline
- keywords: [oauth, jwt, bearer]
  pillar: identity
  default_maturity: Advanced

# ──────────────────────────────────────────────
# Pillar: Devices
# Endpoint health, code quality, supply chain
# ──────────────────────────────────────────────
- keywords: [injection]
  pillar: devices
  default_maturity: Baseline
- keywords: [xss, cross.site]
  pillar: devices
  default_maturity: Advanced
- keywords: [rce, remote.code, command.injection]
  pillar: devices
  default_maturity: Advanced
- keywords: [buffer.overflow, use.after.free, memory.safety]
  pillar: devices
  default_maturity: Advanced
- keywords: [path.traversal, lfi, directory.traversal]
  pillar: devices
  default_maturity: Baseline
- keywords: [unvalidated, unsanitized]
  pillar: devices
  default_maturity: Baseline

# ──────────────────────────────────────────────
# Pillar: Networks
# Segmentation, traffic security, IaC
# ──────────────────────────────────────────────
- keywords: [misconfig, misconfiguration]
  pillar: networks
  default_maturity: Baseline
- keywords: [ssrf, server.side.request]
  pillar: networks
  default_maturity: Advanced
- keywords: [iac, terraform, cloudformation]
  pillar: networks
  default_maturity: Advanced
- keywords: [docker, container]
  pillar: networks
  default_maturity: Baseline
- keywords: [kubernetes, k8s]
  pillar: networks
  default_maturity: Advanced
- keywords: [open.port, exposed.port, port.exposed]
  pillar: networks
  default_maturity: Baseline
- keywords: [tls, ssl, certificate]
  pillar: networks
  default_maturity: Baseline
- keywords: [firewall, security.group, nacl]
  pillar: networks
  default_maturity: Baseline

