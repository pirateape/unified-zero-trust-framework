- keywords: [csrf, cross.site.request]
  pillar: applications
  default_maturity: Baseline
- keywords: [ssti, server.side.template]
  pillar: applications
  default_maturity: Advanced
- keywords: [idor, insecure.direct]
  pillar: applications
  default_maturity: Advanced
- keywords: [open.redirect]
  pillar: applications
  default_maturity: Baseline
- keywords: [dependency, dependencies]
  pillar: applications
  default_maturity: Baseline
- keywords: [vulnerability, cve, cwe]
  pillar: applications
  default_maturity: Baseline
- keywords: [deserialization]
  pillar: applications
  default_maturity: Advanced
- keywords: [xxe, xml.external]
  pillar: applications
  default_maturity: Advanced
- keywords: [api, rest.endpoint]
