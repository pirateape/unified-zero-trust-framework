- keywords: [dlp, data.loss, exfiltration]
  pillar: data
  default_maturity: Advanced
- keywords: [pii, personally.identifiable, sensitive.data]
  pillar: data
  default_maturity: Advanced
- keywords: [backup, data.retention]
